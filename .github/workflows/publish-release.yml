name: Publicar instalador

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          name: PRIME AIMINO ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            PRIME_AIMINO_INSTALADOR_WINDOWS.exe
            PRIME_AIMINO_PREPARADOR_WINDOWS.zip
